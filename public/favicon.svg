<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="ballGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffedd5"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Dark Container Circle -->
  <rect width="128" height="128" rx="32" fill="#09090b"/>

  <!-- Ping Pong Ball -->
  <g filter="url(#ballShadow)">
    <circle cx="64" cy="64" r="46" fill="url(#ballGlow)"/>
    <!-- Subtle Ping Pong seam curve -->
    <path d="M 32 78 C 48 90, 80 90, 96 78" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 36 46 C 52 38, 76 38, 92 46" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Text measuresoft on the ping pong ball -->
    <text 
      x="64" 
      y="67" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      fill="#09090b" 
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
      font-weight="900" 
      font-size="13.5" 
      letter-spacing="-0.3"
    >measuresoft</text>
  </g>
</svg>
