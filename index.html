<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <script>
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          e.reason &&
          typeof e.reason.message === 'string' &&
          (e.reason.message.includes('send was called before connect') ||
            e.reason.message.includes('failed to connect to websocket'))
        ) {
          e.preventDefault();
        }
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TT Launcher Controller</title>

    <meta property="og:description" content="Table Tennis Ball Launcher Controller for ESP32 and Arduino" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TTLauncher" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
